  <path d="M168 190c10-52 52-92 112-104 22-4 30 12 14 24-30 22-44 42-48 78-4 30-44 52-78 36z" fill="#ec5663"/>
  <path d="M222 108c10-26 26-34 40-32 8 2 8 12 0 16-14 6-24 16-30 34z" fill="#ec5663"/>
  <ellipse cx="236" cy="84" rx="12" ry="6" fill="#c9344a" transform="rotate(-14 236 84)"/>
