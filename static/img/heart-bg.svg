  <path d="M68 305c-12-52 18-104 60-120 32-10 48 18 42 52-6 30-48 46-78 78z" fill="#ff8e8c"/>
  <!-- left atrial appendage (light, right lobe) -->
  <path d="M236 262c-8-34 14-60 48-52 30 8 40 56 24 82-10 14-54 8-72-30z" fill="#ff9a98"/>
  <!-- dark vessel crossing the middle (pulmonary veins) -->
