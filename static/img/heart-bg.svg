  <ellipse cx="318" cy="230" rx="6" ry="15" fill="#8f1f33" transform="rotate(10 318 230)"/>
  <path d="M312 244c8 2 14 12 12 24-6-2-12-10-12-24z" fill="#d9475a"/>
